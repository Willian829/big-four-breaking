<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Big Four Breaking · NBA, NFL, NHL e MLB</title>
  <meta name="description" content="Notícias em tempo real das ligas Big Four da América do Norte: NBA, NFL, NHL e MLB." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#07080c" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Aplica o tema salvo antes da primeira pintura (evita "piscar" o tema errado) -->
  <script>
    try { if (localStorage.getItem('big4:theme') === 'light') document.documentElement.classList.replace('dark', 'light'); } catch (e) {}
  </script>

  <!-- Fontes: Gabarito (títulos) + Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500..900&family=Inter:wght@400..700&display=swap" />

  <!-- Conexões antecipadas com a API de notícias e o CDN de imagens -->
  <link rel="preconnect" href="https://site.api.espn.com" crossorigin />
  <link rel="preconnect" href="https://a.espncdn.com" />

  <!-- Tailwind CSS v4 — build para navegador (sem etapa de compilação) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <style type="text/tailwindcss">
    @custom-variant light (&:where(.light, .light *));

    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Gabarito", "Inter", ui-sans-serif, system-ui, sans-serif;
      --breakpoint-3xl: 120rem; /* 1920px — monitores ultrawide */
    }

    /* Cores semânticas: os valores vêm de css/styles.css e mudam com o tema */
    @theme inline {
      --color-bg: var(--bg);
      --color-surface: var(--surface);
      --color-elevated: var(--elevated);
      --color-line: var(--line);
      --color-fg: var(--fg);
      --color-muted: var(--muted);
      --color-subtle: var(--subtle);
      --color-live: var(--live);
    }
  </style>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="min-h-dvh bg-bg font-sans text-fg antialiased">
  <div id="ambient" class="ambient" aria-hidden="true"></div>

  <a href="#app" id="skip-link" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-full focus:bg-fg focus:px-4 focus:py-2 focus:text-bg">
    Pular para o conteúdo
  </a>

  <!-- ===================== Cabeçalho ===================== -->
  <header id="site-header" class="sticky top-0 z-40 border-b border-line bg-bg/75 backdrop-blur-xl backdrop-saturate-150">
    <div class="mx-auto flex max-w-[1760px] flex-wrap items-center gap-x-8 px-4 sm:px-6 lg:px-10 3xl:max-w-[2240px]">
      <a href="#/" class="flex h-16 items-center gap-2.5" aria-label="Big Four Breaking — página inicial">
        <svg viewBox="0 0 32 32" class="size-8 shrink-0" aria-hidden="true">
          <rect x=".5" y=".5" width="31" height="31" rx="9" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".12" />
          <circle cx="11" cy="11" r="4.25" fill="#f97316" />
          <circle cx="21" cy="11" r="4.25" fill="#10b981" />
          <circle cx="11" cy="21" r="4.25" fill="#22d3ee" />
          <circle cx="21" cy="21" r="4.25" fill="#6366f1" />
        </svg>
        <span class="font-display text-lg font-black leading-none tracking-tight">BIG<span class="text-live">4</span></span>
        <span class="font-display text-lg font-semibold leading-none tracking-tight text-muted">Breaking</span>
      </a>

      <!-- Navegação: vira uma 2ª linha rolável no mobile -->
      <nav aria-label="Ligas" class="order-last w-full md:order-none md:w-auto">
        <div id="nav-track" class="no-scrollbar relative -mx-4 flex gap-1 overflow-x-auto px-4 pb-3 sm:-mx-6 sm:px-6 md:mx-0 md:px-0 md:pb-0">
          <span id="nav-indicator" class="nav-indicator no-transition" aria-hidden="true"></span>
          <a href="#/" data-route="home" class="nav-link">Home</a>
          <a href="#/nba" data-route="nba" data-league="nba" class="nav-link"><span class="dot"></span>NBA</a>
          <a href="#/nfl" data-route="nfl" data-league="nfl" class="nav-link"><span class="dot"></span>NFL</a>
          <a href="#/nhl" data-route="nhl" data-league="nhl" class="nav-link"><span class="dot"></span>NHL</a>
          <a href="#/mlb" data-route="mlb" data-league="mlb" class="nav-link"><span class="dot"></span>MLB</a>
        </div>
      </nav>

      <div class="ml-auto flex h-16 items-center gap-2">
        <p data-status class="mr-2 hidden items-center gap-2 text-xs text-muted sm:flex" aria-live="polite">
          <span class="status-dot"></span><span class="status-text">Carregando…</span>
        </p>
        <button id="refresh-btn" type="button" class="icon-btn" aria-label="Atualizar notícias" title="Atualizar notícias">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-[18px]" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v4.5h-4.5" />
          </svg>
        </button>
        <button id="theme-btn" type="button" class="icon-btn" aria-label="Ativar modo claro" title="Alternar tema">
          <!-- sol (aparece no modo escuro) -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="size-[18px] light:hidden" aria-hidden="true">
            <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <!-- lua (aparece no modo claro) -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden size-[18px] light:block" aria-hidden="true">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===================== Ticker "Últimas" ===================== -->
  <div id="ticker" class="border-b border-line bg-surface/40" hidden>
    <div class="mx-auto flex max-w-[1760px] items-center 3xl:max-w-[2240px]">
      <div class="flex shrink-0 items-center gap-2 py-2.5 pl-4 pr-2 text-[11px] font-bold uppercase tracking-[0.18em] text-live sm:pl-6 lg:pl-10">
        <span class="live-dot"></span>Últimas
      </div>
      <div class="ticker-viewport no-scrollbar">
        <div id="ticker-track" class="ticker-track"></div>
      </div>
    </div>
  </div>

  <!-- ===================== Conteúdo (renderizado pelo js/app.js) ===================== -->
  <main id="app" tabindex="-1" class="mx-auto max-w-[1760px] px-4 pb-24 outline-none sm:px-6 lg:px-10 3xl:max-w-[2240px]">
    <noscript>
      <p class="py-24 text-center text-muted">Ative o JavaScript para carregar as notícias em tempo real.</p>
    </noscript>
  </main>

  <!-- ===================== Rodapé ===================== -->
  <footer class="border-t border-line">
    <div class="mx-auto grid max-w-[1760px] gap-8 px-4 py-12 sm:px-6 lg:grid-cols-[1fr_auto] lg:px-10 3xl:max-w-[2240px]">
      <div>
        <p class="font-display text-lg font-black tracking-tight">BIG<span class="text-live">4</span> <span class="font-semibold text-muted">Breaking</span></p>
        <p class="mt-2 max-w-xl text-sm leading-relaxed text-subtle">
          Manchetes, resumos e imagens via ESPN (API pública não oficial); os direitos pertencem aos autores originais.
          Projeto independente, sem afiliação com NBA, NFL, NHL, MLB ou ESPN.
        </p>
      </div>
      <nav aria-label="Ligas (rodapé)" class="flex flex-wrap items-start gap-2 text-sm">
        <a href="#/nba" data-league="nba" class="badge"><span class="dot"></span>NBA</a>
        <a href="#/nfl" data-league="nfl" class="badge"><span class="dot"></span>NFL</a>
        <a href="#/nhl" data-league="nhl" class="badge"><span class="dot"></span>NHL</a>
        <a href="#/mlb" data-league="mlb" class="badge"><span class="dot"></span>MLB</a>
      </nav>
    </div>
  </footer>

  <!-- Aviso de novas notícias (atualização em segundo plano) -->
  <button id="new-pill" type="button" class="new-pill" data-show="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5" /></svg>
    <span></span>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite" data-show="false"></div>

  <!-- config.js primeiro: é nele que ficam as opções e a chave de API (opcional) -->
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
