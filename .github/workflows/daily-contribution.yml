# Rotina diária de manutenção
#
# O que faz: executa uma verificação automatizada real do repositório (inventário de
# arquivos versionados e integridade dos arquivos Markdown), grava o resultado em
# docs/maintenance-log.md numa branch própria, abre um pull request com o relatório e o
# mescla na branch padrão. O PR é atribuído ao dono do repositório e recebe o rótulo
# "manutencao-automatica", para aparecer em buscas como "is:pr assignee:@me" ou
# "label:manutencao-automatica". Se a verificação encontrar pendências, abre (ou
# atualiza) uma issue atribuída ao dono; quando as pendências somem, a issue é fechada.
#
# Requisito: em cada repositório, Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests" precisa estar marcado.
# Sem isso o GitHub recusa a criação do PR; o workflow então abre uma issue explicando.
#
# Rodízio: este mesmo arquivo existe, idêntico, em todos os repositórios listados em
# ROTATION_REPOS. A cada dia (UTC) apenas UM deles registra a verificação; os demais
# encerram em poucos segundos, sem checkout e sem commit. Resultado: no máximo um commit
# automático por dia, somando todos os repositórios.
#
# Sem loops: o workflow só dispara por agendamento ou manualmente, e tudo o que ele faz
# (push, PR, merge, issues) usa o GITHUB_TOKEN, que por regra do GitHub não dispara
# outros workflows.
#
# Como desativar (qualquer uma das opções):
#   1. Actions > "Rotina diária de manutenção" > menu "..." > Disable workflow.
#   2. Settings > Secrets and variables > Actions > Variables:
#      criar DAILY_CONTRIBUTION_ENABLED com o valor false.
#   3. Apagar este arquivo.

name: Rotina diária de manutenção

on:
  schedule:
    # O GitHub Actions agenda em UTC e, em contas gratuitas, atrasa ou descarta boa parte
    # das execuções (nos repositórios desta conta, um cron de hora em hora dispara só de
    # 2 a 4 vezes por dia). Por isso há 8 tentativas diárias: a primeira que rodar no dia
    # da vez do repositório registra a verificação; as demais encerram sem commit.
    # A decisão usa sempre a data UTC do momento em que a execução de fato começa.
    - cron: "43 */3 * * *" # 00:43, 03:43, ... 21:43 UTC (21:43, 00:43, ... 18:43 em Brasília)
  workflow_dispatch:
    inputs:
      force:
        description: "Registrar hoje neste repositório, mesmo fora da vez dele no rodízio"
        type: boolean
        default: false
      dry_run:
        description: "Só executar as verificações, sem criar commit nem PR"
        type: boolean
        default: false

permissions:
  contents: write # gravar a branch do PR e mesclá-lo na branch padrão
  pull-requests: write # abrir, atribuir e mesclar o PR
  issues: write # rótulo, atribuição e issues de aviso ou de pendências

concurrency:
  group: daily-contribution
  cancel-in-progress: false

env:
  # Ordem do rodízio. A posição na lista define o dia de cada repositório.
  # Para incluir ou retirar um repositório, altere a lista em TODOS os repositórios
  # participantes (o arquivo precisa continuar idêntico em todos).
  ROTATION_REPOS: >-
    pulso-games
    Biblioteca
    learnquest
    Coffee
    ContaBancaria
    big-four-breaking
  LOG_FILE: docs/maintenance-log.md
  MAINT_LABEL: manutencao-automatica

jobs:
  maintenance:
    name: Verificação e registro
    # Interruptor geral (variável de repositório) e proteção contra execução em forks.
    if: ${{ vars.DAILY_CONTRIBUTION_ENABLED != 'false' && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Conferir a vez no rodízio
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY#*/}"
          read -r -a repos <<< "${ROTATION_REPOS}"
          total=${#repos[@]}
          if [ "${total}" -eq 0 ]; then
            echo "::error::ROTATION_REPOS está vazio; não há rodízio definido."
            exit 1
          fi

          slot=-1
          for i in "${!repos[@]}"; do
            if [ "${repos[$i],,}" = "${repo_name,,}" ]; then slot=$i; fi
          done

          # Dia corrente em UTC, contado desde 1970-01-01. O resto da divisão pelo
          # número de repositórios indica de quem é a vez.
          now=$(date -u +%s)
          today=$(date -u -d "@${now}" +%F)
          hhmm=$(date -u -d "@${now}" +%H%M)
          day_index=$(( now / 86400 ))
          turn=$(( day_index % total ))

          is_turn=false
          if [ "${slot}" -eq "${turn}" ]; then is_turn=true; fi

          if [ "${slot}" -lt 0 ]; then
            echo "::warning::${repo_name} não está em ROTATION_REPOS; nenhum commit agendado será feito aqui."
            next="(fora do rodízio)"
          else
            days_until=$(( (slot - turn + total) % total ))
            next=$(date -u -d "@$(( (day_index + days_until) * 86400 ))" +%F)
          fi

          run=false
          commit=false
          case "${EVENT_NAME}" in
            schedule)
              run=${is_turn}
              commit=${is_turn}
              reason="agendamento; vez de hoje: ${repos[$turn]}"
              ;;
            workflow_dispatch)
              run=true
              if [ "${is_turn}" = true ] || [ "${INPUT_FORCE:-false}" = true ]; then commit=true; fi
              if [ "${INPUT_DRY_RUN:-false}" = true ]; then commit=false; fi
              reason="execução manual (force=${INPUT_FORCE:-false}, dry_run=${INPUT_DRY_RUN:-false}); vez de hoje: ${repos[$turn]}"
              ;;
            *)
              reason="evento não previsto: ${EVENT_NAME}"
              ;;
          esac

          # Branch padrão: vem do evento; se faltar, consulta a API do GitHub.
          default_branch="${EVENT_DEFAULT_BRANCH:-}"
          if [ -z "${default_branch}" ] && [ "${run}" = true ]; then
            default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          fi
          if [ -z "${default_branch}" ] && [ "${run}" = true ]; then
            echo "::error::Não foi possível identificar a branch padrão."
            exit 1
          fi

          # Proteções extras das execuções agendadas (as manuais ficam a critério de quem dispara).
          if [ "${EVENT_NAME}" = schedule ] && [ "${run}" = true ]; then
            # 1. Perto da virada do dia em UTC o commit poderia cair na data seguinte e
            #    coincidir com o do próximo repositório do rodízio.
            if [ "$(( 10#${hhmm} ))" -ge 2345 ]; then
              run=false
              commit=false
              reason="${reason}; muito perto da virada do dia em UTC, fica para a próxima vez"
            else
              # 2. Se o registro de hoje já está na branch padrão, encerra aqui, sem baixar
              #    o repositório.
              log_now=$(gh api -H "Accept: application/vnd.github.raw" \
                "repos/${GITHUB_REPOSITORY}/contents/${LOG_FILE}?ref=${default_branch}" 2>/dev/null || true)
              if grep -q "^| ${today} |" <<< "${log_now}"; then
                run=false
                commit=false
                reason="${reason}; o registro de hoje já existe"
              fi
            fi
          fi

          {
            echo "run=${run}"
            echo "commit=${commit}"
            echo "today=${today}"
            echo "default_branch=${default_branch}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Rodízio"
            echo ""
            echo "- Data (UTC): ${today} (dia ${day_index})"
            echo "- Repositórios no rodízio: ${total}"
            echo "- Vez de hoje: \`${repos[$turn]}\`"
            echo "- Este repositório: \`${repo_name}\` (posição ${slot}); próxima vez: ${next}"
            echo "- Motivo: ${reason}"
            echo "- Executar verificações: ${run}; registrar via PR: ${commit}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Baixar a branch padrão
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.default_branch }}
          fetch-depth: 1

      - name: Verificar o repositório e atualizar o registro
        id: checks
        if: steps.gate.outputs.run == 'true'
        env:
          TODAY: ${{ steps.gate.outputs.today }}
          WRITE_LOG: ${{ steps.gate.outputs.commit }}
          REPORT_FILE: ${{ runner.temp }}/maintenance-report.md
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import urllib.parse
          from pathlib import Path

          log_file = os.environ["LOG_FILE"]
          today = os.environ["TODAY"]
          write_log = os.environ.get("WRITE_LOG") == "true"
          report_file = os.environ.get("REPORT_FILE") or os.devnull
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "0")
          run_url = "{}/{}/actions/runs/{}".format(
              os.environ.get("GITHUB_SERVER_URL", "https://github.com"),
              os.environ.get("GITHUB_REPOSITORY", ""),
              os.environ.get("GITHUB_RUN_ID", ""),
          )

          listing = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True)
          tracked = [p for p in listing.stdout.decode("utf-8", "replace").split("\0") if p and p != log_file]
          markdown = [p for p in tracked if p.lower().endswith((".md", ".markdown"))]

          FENCE = re.compile(r"^ {0,3}(`{3,}|~{3,})")
          INLINE_CODE = re.compile(r"`[^`\n]*`")
          TARGETS = (
              re.compile(r"\]\(\s*(<[^>\n]+>|[^)\s]+)"),            # [texto](destino) e ![alt](destino)
              re.compile(r"^ {0,3}\[[^\]\n]+\]:\s*(\S+)"),          # [ref]: destino
              re.compile(r"""(?:src|href)\s*=\s*["']([^"'\n]+)["']"""),  # HTML embutido
          )
          EXTERNAL = re.compile(r"^(?:[A-Za-z][A-Za-z0-9+.-]*:|//|#)")

          def local_path(md_path, target):
              """Caminho local apontado por um link relativo, ou None se for externo/âncora."""
              target = target.strip()
              if target.startswith("<") and target.endswith(">"):
                  target = target[1:-1].strip()
              if not target or EXTERNAL.match(target) or "{{" in target or "${" in target:
                  return None
              target = urllib.parse.unquote(target.split("#", 1)[0].split("?", 1)[0])
              if not target:
                  return None
              base = "." if target.startswith("/") else os.path.dirname(md_path)
              return os.path.normpath(os.path.join(base, target.lstrip("/")))

          broken = []    # (arquivo, linha, destino)
          unclosed = []  # (arquivo, linha de abertura)
          empty = []     # arquivos Markdown sem conteúdo

          for md in markdown:
              try:
                  text = Path(md).read_text(encoding="utf-8", errors="replace")
              except OSError as exc:
                  print(f"::warning file={md}::Não foi possível ler o arquivo: {exc}")
                  continue
              if not text.strip():
                  empty.append(md)
                  continue
              fence = None  # (caractere, tamanho, linha) enquanto um bloco está aberto
              for number, line in enumerate(text.splitlines(), start=1):
                  match = FENCE.match(line)
                  if fence is None and match:
                      fence = (match.group(1)[0], len(match.group(1)), number)
                      continue
                  if fence is not None:
                      if match and match.group(1)[0] == fence[0] and len(match.group(1)) >= fence[1] \
                              and not line.strip().strip(fence[0]):
                          fence = None
                      continue
                  clean = INLINE_CODE.sub("", line)
                  for pattern in TARGETS:
                      for target in pattern.findall(clean):
                          path = local_path(md, target)
                          if path is None:
                              continue
                          if path.startswith("..") or not os.path.exists(path):
                              broken.append((md, number, target))
              if fence is not None:
                  unclosed.append((md, fence[2]))

          readme = next(
              (p for p in tracked if "/" not in p and p.lower() in ("readme.md", "readme.markdown", "readme", "readme.txt", "readme.rst")),
              None,
          )
          if readme is None:
              readme_status = "ausente"
          else:
              content = Path(readme).read_text(encoding="utf-8", errors="replace")
              readme_status = "vazio" if not content.strip() else f"ok ({len(content.splitlines())} linhas)"

          issues = []
          if readme_status in ("ausente", "vazio"):
              issues.append(f"README {readme_status}")
          if broken:
              issues.append(f"{len(broken)} link(s) relativo(s) quebrado(s)")
          if unclosed:
              issues.append(f"{len(unclosed)} bloco(s) de código sem fechamento")
          other_empty = [p for p in empty if p != readme]
          if other_empty:
              issues.append(f"{len(other_empty)} arquivo(s) Markdown vazio(s)")
          result = "⚠️ " + "; ".join(issues) if issues else "✅ sem pendências"

          for md, number, target in broken[:20]:
              print(f"::warning file={md},line={number}::Link relativo quebrado: {target}")
          for md, number in unclosed[:20]:
              print(f"::warning file={md},line={number}::Bloco de código aberto e não fechado")
          for md in other_empty[:20]:
              print(f"::warning file={md}::Arquivo Markdown vazio")

          row = (
              f"| {today} | {len(tracked)} | {len(markdown)} | {len(broken)} | {len(unclosed)} "
              f"| {readme_status} | {result} | [#{run_number}]({run_url}) |"
          )

          HEADER = """# Registro de manutenção

          Este arquivo é atualizado automaticamente pelo workflow
          [`daily-contribution.yml`](../.github/workflows/daily-contribution.yml).
          Cada linha registra uma verificação automatizada do repositório: inventário dos
          arquivos versionados e integridade dos arquivos Markdown (links relativos, blocos de
          código sem fechamento e presença do README). A coluna "Execução" aponta para a
          execução do GitHub Actions que gerou a linha.

          Para pausar: Actions > "Rotina diária de manutenção" > Disable workflow, ou crie a
          variável de repositório `DAILY_CONTRIBUTION_ENABLED` com o valor `false`.

          | Data (UTC) | Arquivos versionados | Arquivos Markdown | Links relativos quebrados | Blocos de código abertos | README | Resultado | Execução |
          | --- | ---: | ---: | ---: | ---: | --- | --- | --- |
          """
          HEADER = "\n".join(line.strip() for line in HEADER.splitlines()) + "\n"

          log_path = Path(log_file)
          current = log_path.read_text(encoding="utf-8") if log_path.exists() else ""
          already = any(line.startswith(f"| {today} |") for line in current.splitlines())

          changed = False
          if already:
              status = "já existe registro de hoje; nada a acrescentar"
          elif not write_log:
              status = "verificação concluída sem registro (fora da vez no rodízio ou dry_run)"
          else:
              text = current if current.strip() else HEADER
              if not text.endswith("\n"):
                  text += "\n"
              log_path.parent.mkdir(parents=True, exist_ok=True)
              log_path.write_text(text + row + "\n", encoding="utf-8")
              changed = True
              status = f"linha acrescentada em {log_file}"

          # Relatório em Markdown, usado no corpo do PR e, se houver pendências, na issue.
          report = [
              f"#### Verificação de {today}",
              "",
              "| Item | Valor |",
              "| --- | --- |",
              f"| Arquivos versionados | {len(tracked)} |",
              f"| Arquivos Markdown | {len(markdown)} |",
              f"| Links relativos quebrados | {len(broken)} |",
              f"| Blocos de código abertos | {len(unclosed)} |",
              f"| README | {readme_status} |",
              f"| Resultado | {result} |",
          ]
          details = []
          if readme_status in ("ausente", "vazio"):
              details.append(f"- README {readme_status}")
          details += [f"- `{md}`, linha {n}: link relativo quebrado `{t}`" for md, n, t in broken[:30]]
          details += [f"- `{md}`, linha {n}: bloco de código aberto e não fechado" for md, n in unclosed[:30]]
          details += [f"- `{md}`: arquivo Markdown vazio" for md in other_empty[:30]]
          if details:
              report += ["", "Pendências:", ""] + details
          report += ["", f"Execução: [#{run_number}]({run_url})"]
          with open(report_file, "w", encoding="utf-8") as out:
              out.write("\n".join(report) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"changed={'true' if changed else 'false'}\n")
              out.write(f"has_issues={'true' if issues else 'false'}\n")

          summary = [
              "### Verificação",
              "",
              "| Item | Valor |",
              "| --- | --- |",
              f"| Arquivos versionados | {len(tracked)} |",
              f"| Arquivos Markdown | {len(markdown)} |",
              f"| Links relativos quebrados | {len(broken)} |",
              f"| Blocos de código abertos | {len(unclosed)} |",
              f"| README | {readme_status} |",
              f"| Resultado | {result} |",
              f"| Registro | {status} |",
              "",
          ]
          print("\n".join(summary))
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8") as out:
              out.write("\n".join(summary) + "\n")
          PY

      - name: Abrir o PR e mesclar na branch padrão
        id: pr
        if: steps.gate.outputs.commit == 'true' && steps.checks.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          TODAY: ${{ steps.gate.outputs.today }}
          DEFAULT_BRANCH: ${{ steps.gate.outputs.default_branch }}
          REPORT_FILE: ${{ runner.temp }}/maintenance-report.md
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          branch="manutencao/${TODAY}"
          server="${GITHUB_SERVER_URL:-https://github.com}"
          run_url="${server}/${repo}/actions/runs/${GITHUB_RUN_ID}"
          workflow_url="${server}/${repo}/blob/${DEFAULT_BRANCH}/.github/workflows/daily-contribution.yml"
          tmp="${RUNNER_TEMP:-/tmp}"
          perm_title="Rotina de manutenção: GitHub Actions sem permissão para abrir PRs"
          title="chore: rotina automatizada de manutenção (${TODAY})"

          # Número da issue aberta da rotina com o título exato, ou nada.
          find_issue() {
            gh api "repos/${repo}/issues?state=open&labels=${MAINT_LABEL}&per_page=100" \
              --jq ".[] | select(.pull_request == null and .title == \"$1\") | .number" 2>/dev/null \
              | head -n 1 || true
          }

          # Identidade: e-mail noreply do dono do repositório (ID+login), que o GitHub
          # associa à conta. Nenhum token ou e-mail pessoal fica gravado no arquivo.
          owner_id="${OWNER_ID:-}"
          if [ -z "${owner_id}" ]; then
            owner_id=$(gh api "users/${OWNER}" --jq .id)
          fi
          if [ -z "${owner_id}" ]; then
            echo "::error::Não foi possível obter o ID da conta ${OWNER} para montar o e-mail noreply."
            exit 1
          fi
          git config user.name "${OWNER}"
          git config user.email "${owner_id}+${OWNER}@users.noreply.github.com"

          git add -- "${LOG_FILE}"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a registrar; PR não criado."
            exit 0
          fi
          git commit -q \
            -m "chore: rotina automatizada de manutenção" \
            -m "Verificação automatizada de ${TODAY} (execução #${GITHUB_RUN_NUMBER})."

          # 1. Branch do PR, recriada a partir da branch padrão se sobrou de uma tentativa anterior.
          git push --force origin "HEAD:refs/heads/${branch}"

          # 2. Rótulo que identifica os PRs e issues da rotina (criado na primeira vez).
          gh api "repos/${repo}/labels" -f name="${MAINT_LABEL}" -f color="0e8a16" \
            -f description="Criado pela rotina diária de manutenção" >/dev/null 2>&1 || true

          # 3. Pull request (reaproveita um PR aberto da mesma branch, se houver).
          {
            echo "Verificação automatizada do repositório, registrada em \`${LOG_FILE}\`."
            echo ""
            cat "${REPORT_FILE}"
            echo ""
            echo "---"
            echo "Aberto e mesclado automaticamente pelo workflow [daily-contribution.yml](${workflow_url})."
          } > "${tmp}/pr-body.md"

          pr=$(gh api "repos/${repo}/pulls?state=open&head=${OWNER}:${branch}" --jq '.[0].number // empty' || true)
          if [ -z "${pr}" ]; then
            if ! out=$(gh api "repos/${repo}/pulls" -f title="${title}" -f head="${branch}" \
                  -f base="${DEFAULT_BRANCH}" -F body=@"${tmp}/pr-body.md" --jq .number 2>&1); then
              echo "${out}"
              if grep -qi "not permitted to create or approve pull requests" <<< "${out}"; then
                if [ -z "$(find_issue "${perm_title}")" ]; then
                  {
                    echo "A rotina diária de manutenção tentou abrir um pull request e o GitHub recusou:"
                    echo "o GitHub Actions não tem permissão para criar PRs neste repositório."
                    echo ""
                    echo "Para corrigir:"
                    echo ""
                    echo "1. Abra [Settings > Actions > General](${server}/${repo}/settings/actions)."
                    echo "2. Em **Workflow permissions**, marque **Allow GitHub Actions to create and approve pull requests**."
                    echo "3. Clique em **Save**."
                    echo ""
                    echo "As próximas execuções tentam de novo e fecham esta issue quando conseguirem."
                    echo "A verificação de ${TODAY} ficou na branch \`${branch}\`, sem mesclar."
                    echo ""
                    echo "Execução: [#${GITHUB_RUN_NUMBER}](${run_url})"
                  } > "${tmp}/issue-body.md"
                  gh api "repos/${repo}/issues" -f title="${perm_title}" -F body=@"${tmp}/issue-body.md" \
                    -f "assignees[]=${OWNER}" -f "labels[]=${MAINT_LABEL}" --jq .html_url \
                    || echo "::warning::Também não foi possível abrir a issue de aviso."
                fi
                echo "::error::O GitHub Actions não tem permissão para abrir PRs neste repositório. Marque 'Allow GitHub Actions to create and approve pull requests' em Settings > Actions > General."
              else
                echo "::error::Não foi possível abrir o PR."
              fi
              exit 1
            fi
            pr=$(grep -Eo '^[0-9]+$' <<< "${out}" | tail -n 1)
          fi
          if [ -z "${pr}" ]; then
            echo "::error::A API não devolveu o número do PR."
            exit 1
          fi
          pr_url="${server}/${repo}/pull/${pr}"
          echo "PR #${pr}: ${pr_url}"

          # 4. Atribui ao dono e aplica o rótulo, para o PR aparecer em "assignee:@me".
          gh api "repos/${repo}/issues/${pr}/assignees" -f "assignees[]=${OWNER}" >/dev/null \
            || echo "::warning::Não foi possível atribuir o PR a ${OWNER}."
          gh api "repos/${repo}/issues/${pr}/labels" -f "labels[]=${MAINT_LABEL}" >/dev/null \
            || echo "::warning::Não foi possível aplicar o rótulo ${MAINT_LABEL} ao PR."

          # 5. Mescla. "rebase" mantém um único commit, com a autoria do dono; os outros
          #    métodos só são usados se o rebase estiver desabilitado no repositório.
          #    Erros transitórios (mesclabilidade ainda em cálculo) são tentados de novo.
          merged_sha=""
          method_used=""
          for attempt in 1 2 3 4 5; do
            for method in rebase merge squash; do
              if out=$(gh api -X PUT "repos/${repo}/pulls/${pr}/merge" -f merge_method="${method}" \
                    -f commit_title="chore: rotina automatizada de manutenção (#${pr})" --jq .sha 2>&1); then
                merged_sha=$(grep -Eo '^[0-9a-f]{40}$' <<< "${out}" | tail -n 1 || true)
                method_used="${method}"
                break 2
              fi
              echo "Tentativa ${attempt}, método ${method}: ${out}"
              grep -qi "are not allowed" <<< "${out}" || break
            done
            sleep $(( attempt * 3 ))
          done
          if [ -z "${method_used}" ]; then
            echo "::error::O PR #${pr} foi aberto, mas não foi possível mesclá-lo. Ele continua aberto: ${pr_url}"
            exit 1
          fi
          if [ "${method_used}" != rebase ]; then
            echo "::notice::PR mesclado com o método '${method_used}', porque o rebase está desabilitado neste repositório."
          fi

          # 6. Limpeza: apaga a branch do PR e fecha o aviso de permissão, se existir.
          gh api -X DELETE "repos/${repo}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          old=$(find_issue "${perm_title}")
          if [ -n "${old}" ]; then
            gh api "repos/${repo}/issues/${old}/comments" \
              -f body="Resolvido: a execução [#${GITHUB_RUN_NUMBER}](${run_url}) abriu e mesclou o PR #${pr}." >/dev/null || true
            gh api -X PATCH "repos/${repo}/issues/${old}" -f state=closed -f state_reason=completed >/dev/null || true
          fi

          author=$(gh api "repos/${repo}/commits/${merged_sha:-${DEFAULT_BRANCH}}" --jq '.commit.author.email' 2>/dev/null || echo "não consultado")
          echo "number=${pr}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Pull request"
            echo ""
            echo "- PR: [#${pr}](${pr_url}), mesclado com \`${method_used}\`"
            echo "- Branch: \`${branch}\` -> \`${DEFAULT_BRANCH}\`"
            echo "- Commit na branch padrão: \`${merged_sha:0:7}\`"
            echo "- Autor do commit: ${author}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Registrar pendências em issue
        if: steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TODAY: ${{ steps.gate.outputs.today }}
          HAS_ISSUES: ${{ steps.checks.outputs.has_issues }}
          REPORT_FILE: ${{ runner.temp }}/maintenance-report.md
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          tmp="${RUNNER_TEMP:-/tmp}"
          title="Rotina de manutenção: pendências na documentação"

          existing=$(gh api "repos/${repo}/issues?state=open&labels=${MAINT_LABEL}&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"${title}\") | .number" 2>/dev/null \
            | head -n 1 || true)

          if [ "${HAS_ISSUES}" = true ]; then
            {
              echo "A verificação automatizada encontrou pendências nos arquivos Markdown deste repositório."
              echo ""
              cat "${REPORT_FILE}"
            } > "${tmp}/issue-body.md"
            if [ -n "${existing}" ]; then
              gh api "repos/${repo}/issues/${existing}/comments" -F body=@"${tmp}/issue-body.md" >/dev/null \
                && echo "Issue #${existing} atualizada com a verificação de ${TODAY}." \
                || echo "::warning::Não foi possível comentar na issue #${existing}."
            else
              gh api "repos/${repo}/issues" -f title="${title}" -F body=@"${tmp}/issue-body.md" \
                -f "assignees[]=${OWNER}" -f "labels[]=${MAINT_LABEL}" --jq .html_url \
                || echo "::warning::Não foi possível abrir a issue de pendências (as issues estão habilitadas no repositório?)."
            fi
          elif [ -n "${existing}" ]; then
            gh api "repos/${repo}/issues/${existing}/comments" \
              -f body="A verificação de ${TODAY} não encontrou pendências. Fechando." >/dev/null || true
            gh api -X PATCH "repos/${repo}/issues/${existing}" -f state=closed -f state_reason=completed >/dev/null \
              && echo "Issue #${existing} fechada: sem pendências." \
              || echo "::warning::Não foi possível fechar a issue #${existing}."
          else
            echo "Sem pendências; nenhuma issue a abrir."
          fi
